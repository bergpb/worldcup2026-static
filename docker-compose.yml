volumes:
  wc-data:

services:
  dev:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - wc-data:/data:ro
    ports:
      - "8080:80"
    profiles:
      - dev

  prod:
    build: .
    ports:
      - "8081:80"
    volumes:
      - wc-data:/data:ro
    restart: unless-stopped
    profiles:
      - prod

  fetcher:
    image: alpine
    command:
      - sh
      - -c
      - |
        while true; do
          wget -qO /tmp/data.json.tmp 'https://fancy-block-fde3.aking116.workers.dev/competitions/WC/matches?season=2026' \
            && mv /tmp/data.json.tmp /data/data.json \
            && echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] data.json updated"
          wget -qO /tmp/scorers.json.tmp 'https://fancy-block-fde3.aking116.workers.dev/competitions/WC/scorers?season=2026&limit=200' \
            && mv /tmp/scorers.json.tmp /data/scorers.json \
            && echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] scorers.json updated"
          sleep 60
        done
    volumes:
      - wc-data:/data
    restart: unless-stopped
    profiles:
      - dev
      - prod
