volumes:
  wc-data:

services:
  dev:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - wc-data:/data:ro
    ports:
      - "8080:80"
    depends_on:
      - builder
    profiles:
      - dev

  builder:
    image: node:alpine
    working_dir: /app
    command: node watch.js
    volumes:
      - .:/app
    ports:
      - "35729:35729"
    profiles:
      - dev

  prod:
    build: .
    ports:
      - "8081:80"
    volumes:
      - wc-data:/data:ro
    restart: unless-stopped
    profiles:
      - prod

  fetcher:
    image: python:3.12-alpine
    working_dir: /app
    command: python3 fetcher.py
    volumes:
      - .:/app:ro
      - wc-data:/data
    restart: unless-stopped
    profiles:
      - dev
      - prod
