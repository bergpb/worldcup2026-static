server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # data.json — served from shared volume (updated by fetcher); baked copy is fallback
    location = /data.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        root /data;
        try_files /data.json @data_baked;
    }

    location @data_baked {
        root /usr/share/nginx/html;
    }

    # Service worker — never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # styles.css — no cache (updated every deploy, no hash in filename)
    location = /styles.css {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets — cache aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML pages — never cache, no-transform prevents Cloudflare injecting beacon.min.js
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform";
        try_files $uri $uri/ =404;
    }
}
