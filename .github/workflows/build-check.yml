name: Build Check

on:
  push:
    branches: [personal]
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build
        run: python3 build.py

      - name: Run JS unit tests
        run: npm test

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify source files have empty partial markers
        run: python3 scripts/check_empty_markers.py
