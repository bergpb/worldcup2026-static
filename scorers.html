    lbl_timezone:'Zona Horaria',
    teams:{'Algeria':'Argelia','Australia':'Australia','Belgium':'Bélgica','Bosnia':'Bosnia','Bosnia & Herz.':'Bosnia y Herz.','Bosnia-H.':'Bosnia-H.','Brazil':'Brasil','Cape Verde':'Cabo Verde','Colombia':'Colombia','Congo DR':'Congo RD','Croatia':'Croacia','Curaçao':'Curaçao','Czechia':'Chequia','Ecuador':'Ecuador','Egypt':'Egipto','England':'Inglaterra','France':'Francia','Germany':'Alemania','Ghana':'Ghana','Iran':'Irán','Iraq':'Irak','Ivory Coast':'Costa de Marfil','Japan':'Japón','Korea Republic':'Corea del Sur','Mexico':'México','Morocco':'Marruecos','Netherlands':'Países Bajos','New Zealand':'Nueva Zelanda','Norway':'Noruega','Qatar':'Catar','Saudi Arabia':'Arabia Saudita','Scotland':'Escocia','Senegal':'Senegal','South Africa':'Sudáfrica','South Korea':'Corea del Sur','Spain':'España','Sweden':'Suecia','Switzerland':'Suiza','Tunisia':'Túnez','Turkiye':'Turquía','Turkey':'Turquía','USA':'EE.UU.','United States':'EE.UU.','Uruguay':'Uruguay','Uzbekistan':'Uzbekistán'},

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const LANGS = {
  en: { ...LANGS_COMMON.en,
    sub_scorers: 'Golden Boot Race &bull; Top Scorers',
    loading: 'Loading scorers...',
    col_player: 'Player', col_goals: 'GOALS', col_assists: 'ASSISTS',
    col_pens: 'PENS', col_mp: 'PLAYED',
    no_scorers: 'No scorers yet — check back once matches are played.',
    error_load: 'Could not load scorers. Try again shortly.',
    lbl_updated: 'Updated',
    footer_feedback: '&#128172; Feedback &amp; suggestions',
  },
  pt: { ...LANGS_COMMON.pt,
    sub_scorers: 'Chuteira de Ouro &bull; Artilheiros',
    loading: 'Carregando artilheiros...',
    col_player: 'Jogador', col_goals: 'GOLS', col_assists: 'ASSISTÊNCIAS',
    col_pens: 'PÊNALTIS', col_mp: 'JOGOS',
    no_scorers: 'Nenhum gol ainda — volte quando as partidas começarem.',
    error_load: 'Não foi possível carregar. Tente novamente em breve.',
    lbl_updated: 'Atualizado às',
    footer_feedback: '&#128172; Feedback &amp; sugestões',
  },
  es: { ...LANGS_COMMON.es,
    sub_scorers: 'Carrera por la Bota de Oro &bull; Goleadores',
    loading: 'Cargando goleadores...',
    col_player: 'Jugador', col_goals: 'GOLES', col_assists: 'ASISTENCIAS',
    col_pens: 'PENALES', col_mp: 'JUGADOS',
    no_scorers: 'Sin goleadores aún — vuelve cuando comiencen los partidos.',
    error_load: 'No se pudo cargar. Intenta de nuevo pronto.',
    lbl_updated: 'Actualizado a las',
    footer_feedback: '&#128172; Sugerencias y comentarios',
  },
};

<!-- partial:common-js -->
let _lang = 'en';
try { _lang = localStorage.getItem('wc2026_lang') || 'en'; } catch(e) {}

function t(key) {
  return (LANGS[_lang] || LANGS.en)[key] ?? LANGS.en[key] ?? key;
}
function teamName(n) { return LANGS[_lang]?.teams?.[n] ?? n; }

const LANG_FLAGS  = { en:'us', pt:'br', es:'es' };
const LANG_LABELS = { en:'EN', pt:'PT', es:'ES' };
function langBtnHTML(lang) {
  const code  = LANG_FLAGS[lang];
  const label = LANG_LABELS[lang];
  return `<img src="https://flagcdn.com/w20/${code}.png" alt="${label}" style="width:18px;height:13px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:5px;">${label}`;
}

function cycleLang() {
  const order = ['en','pt','es'];
  _lang = order[(order.indexOf(_lang) + 1) % order.length];
  try { localStorage.setItem('wc2026_lang', _lang); } catch(e) {}
  applyLang();
  if (typeof window._onLangChange === 'function') window._onLangChange();
}

function shareApp() {
  const d = { title: 'FIFA World Cup 2026', url: location.href };
  if (navigator.share) navigator.share(d).catch(() => {});
  else navigator.clipboard.writeText(location.href).catch(() => {});
}
<!-- /partial:common-js -->
if (!LANGS[_lang]) _lang = 'en';
window._onLangChange = () => renderScorers();

function applyLang() {
  const btn = document.getElementById('lang-btn');
  if (btn) btn.innerHTML = langBtnHTML(_lang);

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t(el.dataset.i18n);
    if (val !== undefined) el.innerHTML = val;
  });

  ['schedule', 'groups', 'knockout', 'scorers', 'feedback'].forEach(k => {
    const el = document.getElementById('nav-' + k);
    if (el) el.innerHTML = t('nav_' + k);
  });
}

// ── Scorers ───────────────────────────────────────────────────────────────────
const FLAGS = {
  'Algeria':'dz','Argentina':'ar','Australia':'au','Austria':'at','Belgium':'be',
  'Bosnia-H.':'ba','Bosnia':'ba','Bosnia-Herzegovina':'ba','Brazil':'br','Canada':'ca',
  'Cape Verde':'cv','Colombia':'co','Congo DR':'cd','Croatia':'hr','Curacao':'cw','Curaçao':'cw',
  'Czechia':'cz','Ecuador':'ec','Egypt':'eg','England':'gb-eng','France':'fr',
  'Germany':'de','Ghana':'gh','Haiti':'ht','Iran':'ir','Iraq':'iq','Ivory Coast':'ci',
  'Japan':'jp','Jordan':'jo','Mexico':'mx','Morocco':'ma','Netherlands':'nl',
  'New Zealand':'nz','Norway':'no','Panama':'pa','Paraguay':'py','Portugal':'pt',
  'Qatar':'qa','Saudi Arabia':'sa','Scotland':'gb-sct','Senegal':'sn',
  'South Africa':'za','Korea Republic':'kr','South Korea':'kr','Spain':'es',
  'Sweden':'se','Switzerland':'ch','Tunisia':'tn','Turkey':'tr','Turkiye':'tr',
  'USA':'us','United States':'us','Uruguay':'uy','Uzbekistan':'uz',
};

function flagImg(shortName) {
  const code = FLAGS[shortName];
  return code ? `<img src="https://flagcdn.com/w20/${code}.png" alt="${shortName}">` : '';
}

function posClass(i) {
  if (i === 0) return 'gold';
  if (i === 1) return 'silver';
  if (i === 2) return 'bronze';
  return '';
}

let _scorers = [];

function renderScorers() {
  const container = document.getElementById('scorers-container');

  if (_scorers.length === 0) {
    container.innerHTML = `<div class="scorers-loading">${t('no_scorers')}</div>`;
    return;
  }

  let html = `<table class="scorers-table">
    <thead><tr>
      <th>#</th>
      <th style="text-align:left;">${t('col_player')}</th>
      <th>&#9917;<br><span style="font-size:9px;letter-spacing:1px;">${t('col_goals')}</span></th>
      <th>&#x1F170;&#xFE0F;<br><span style="font-size:9px;letter-spacing:1px;">${t('col_assists')}</span></th>
      <th>&#127919;<br><span style="font-size:9px;letter-spacing:1px;">${t('col_pens')}</span></th>
      <th class="col-mp"><span style="font-size:11px;letter-spacing:1px;">MP</span><br><span style="font-size:9px;letter-spacing:1px;">${t('col_mp')}</span></th>
    </tr></thead>
    <tbody>`;

  _scorers.forEach((s, i) => {
    const prev = i > 0 ? _scorers[i - 1] : null;
    const tied = prev && s.goals === prev.goals && (s.assists ?? 0) === (prev.assists ?? 0);
    const posDisplay = tied ? '=' : (i + 1);
    html += `<tr>
      <td class="pos ${posClass(i)}">${posDisplay}</td>
      <td style="text-align:left;">
        <div class="player-name">${s.player.name}</div>
        <div class="player-team">${flagImg(s.team.shortName)} ${teamName(s.team.shortName)}</div>
      </td>
      <td class="goals">${s.goals ?? '-'}</td>
      <td class="stat">${s.assists ?? '-'}</td>
      <td class="stat">${s.penalties ?? '-'}</td>
      <td class="stat col-mp">${s.playedMatches ?? '-'}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;

  const lu = document.getElementById('last-updated');
  if (lu) lu.textContent = t('lbl_updated') + ' ' + new Date().toLocaleTimeString();
}

async function loadScorers() {
  try {
    const res = await fetch('scorers.json?t=' + Date.now());
    const data = await res.json();
    _scorers = (data.scorers || []).sort((a, b) => {
      if (b.goals !== a.goals) return b.goals - a.goals;
      return (b.assists ?? 0) - (a.assists ?? 0);
    });
    renderScorers();
  } catch(e) {
    document.getElementById('scorers-container').innerHTML =
      `<div class="scorers-loading">${t('error_load')}</div>`;
  }
}

applyLang();
loadScorers();
setInterval(loadScorers, 60000);
</script>
